<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" role="img" aria-label="How QuizShip generates a quiz: Sonnet writes a short quiz in one call; a long one gets a plan from Opus and is written by Sonnet in parallel parts; code fixes and checks the draft, Sonnet rewrites only the questions that fail, and code shuffles the options"><desc>A teacher request goes to Sonnet 5.5 in one call for a short quiz, or, for 8 or more multiple choice or 5 or more progressive questions, to Opus 5.5 in fast mode for a plan and then to Sonnet writers in parallel. Code fixes what needs no second opinion, then checks the draft. Questions that fail go back to Sonnet, at most twice; a passing draft is shuffled and returned.</desc><path d="M440 72L440 106" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M440 106L134 106Q125 106 125 115L125 143" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M125 150L120.4 141L129.6 141Z" style="fill:var(--dg-edge,#6a5b82)"/><path d="M440 106L746.5 106Q755 106 755 114.5L755 123" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M755 130L750.4 121L759.6 121Z" style="fill:var(--dg-edge,#6a5b82)"/><path d="M755 202L755 233" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M755 240L750.4 231L759.6 231Z" style="fill:var(--dg-edge,#6a5b82)"/><path d="M125 222L125 389Q125 398 134 398L293 398" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M300 398L291 402.6L291 393.4Z" style="fill:var(--dg-edge,#6a5b82)"/><path d="M755 312L755 387Q755 396 746 396L587 396" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M580 396L589 391.4L589 400.6Z" style="fill:var(--dg-edge,#6a5b82)"/><path d="M440 432L440 469" fill="none" style="stroke:var(--dg-edge,#6a5b82)" stroke-width="1.6"/><path d="M440 476L435.4 467L444.6 467Z" style="fill:var(--dg-edge,#6a5b82)"/><path d